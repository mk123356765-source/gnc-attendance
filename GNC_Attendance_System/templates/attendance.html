<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Attendance Gateway</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 24px 16px; margin: 0; }
        .form-box { width: 100%; max-width: 450px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; border: 1px solid #ddd; }
        h2 { color: #0288d1; text-align: center; }
        input { width: 100%; padding: 12px 10px; margin: 8px 0 15px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { width: 100%; background: #0288d1; color: white; padding: 12px; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
        @media (max-width: 480px) { .form-box { padding: 22px 18px; } }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>🔒 Attendance Gateway</h2>
        <p style="font-size: 12px; color: red; text-align: center; font-weight: bold;">Security Notice: Dynamic credentials reset daily.</p>
        <form method="POST">
            <h4 style="color: #555; margin-bottom: 5px;">🔑 Morning Session Access Keys</h4>
            <label>Today's Username:</label>
            <input type="text" name="daily_user" required>
            <label>Today's Password:</label>
            <input type="password" name="daily_pass" required>
            <hr>
            <h4 style="color: #555; margin-bottom: 5px;">🆔 Verification Details</h4>
            <label>Enter Roll Number to Scan/Log:</label>
            <input type="text" name="roll_no" placeholder="e.g., GNC-3401" required>
            <button type="submit">Verify & Log Present</button>
        </form>
    </div>
</body>
</html>
