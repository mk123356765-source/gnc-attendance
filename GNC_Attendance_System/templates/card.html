<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student ID Card</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px 12px; margin: 0; }
        .card { width: 100%; max-width: 340px; border: 3px solid #004d40; padding: 20px; margin: 20px auto; text-align: center; border-radius: 12px; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .title { font-size: 14px; font-weight: bold; color: #004d40; margin: 0; }
        .card p { margin: 10px 0; text-align: left; font-size: 15px; border-bottom: 1px dashed #eee; padding-bottom: 5px; }
        .print-btn { background: #0288d1; color: white; padding: 12px 25px; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; display: block; margin: 20px auto; max-width: 100%; }
        .card img { max-width: 100%; height: auto; }
        @media print { .print-btn { display: none; } body { background: white; padding: 0; } .card { border: 2px solid #000; box-shadow: none; margin-top: 50px; } }
    </style>
</head>
<body>
    <div class="card">
        <p class="title">GOVERNMENT NATIONAL COLLEGE</p>
        <p class="title" style="font-size: 11px; color: #555;">KARACHI</p>
        <hr style="border-top: 2px solid #004d40;">
        <p><strong>Name:</strong> {{ name }}</p>
        <p><strong>Roll No:</strong> {{ roll_no }}</p>
        <p><strong>CNIC/B-Form:</strong> {{ cnic }}</p>
        <p><strong>Dept:</strong> {{ dept }}</p>
        <hr style="border-top: 1px dashed #ccc;">
        <img src="{{ url_for('static', filename='qrcodes/' + roll_no + '.png') }}" width="150" alt="QR Code"><br>
        <p style="font-size: 11px; color: #777; text-align: center; border: none;">Scan this card daily for classroom attendance verification.</p>
    </div>
    <button class="print-btn" onclick="window.print()">🖨️ Print Student Card</button>
</body>
</html>
