<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Government National College Karachi</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f7f6; padding: 30px 16px; margin: 0; }
        .container { width: 100%; max-width: 600px; margin: 0 auto; background: white; padding: 32px 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #004d40; font-size: 24px; margin-bottom: 5px; }
        h2 { color: #00796b; font-size: 16px; margin-bottom: 30px; }
        .btn { display: block; width: 85%; margin: 15px auto; padding: 15px; text-decoration: none; font-weight: bold; border-radius: 8px; font-size: 16px; text-align: center; }
        .btn-reg { background-color: #00796b; color: white; }
        .btn-att { background-color: #0288d1; color: white; }
        .btn-priv { background-color: #37474f; color: white; font-size: 14px; width: 60%; }
        @media (max-width: 480px) {
            body { padding: 16px 12px; }
            .container { padding: 24px 16px; }
            h1 { font-size: 21px; }
            .btn, .btn-priv { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GOVERNMENT NATIONAL COLLEGE KARACHI</h1>
        <h2>Smart QR Attendance System</h2>
        <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 30px;">
        <a href="/register" class="btn btn-reg">📋 Student Registration Portal</a>
        <a href="/attendance" class="btn btn-att">🔒 Student Daily Attendance Gate</a>
        <br>
        <a href="/teacher-panel" class="btn btn-priv" style="background-color: #ef6c00;">👨‍🏫 Teacher Announcement Board</a>
        <a href="/principal-panel" class="btn btn-priv">🔑 Principal Command Center</a>
    </div>
</body>
</html>
